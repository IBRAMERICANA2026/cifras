<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Visualizador de Cifra</title>
    <link rel="shortcut icon" href="../img/logo_branco.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../css/visualizar-pdf.css">
</head>

<body>

    <header class="pdf-header">
        <div class="pdf-info">
            <h1 id="nome-cifra">Carregando...</h1>
            <p id="interprete-cifra"></p>
        </div>
        <div class="pdf-actions">
            <button type="button" class="pdf-btn" id="btn-download" title="Baixar PDF">
                📄 Baixar
            </button>
            <button type="button" class="pdf-btn" id="btn-print" title="Imprimir">
                🖨️ Imprimir
            </button>
            <button type="button" class="pdf-btn" id="btn-close" title="Fechar">
                ✕
            </button>
        </div>
    </header>

    <nav class="pdf-nav" id="pdf-nav" style="display:none;">
        <div class="pdf-nav-group">
            <button type="button" class="pdf-btn" id="btn-prev" title="Página anterior">
                ◀
            </button>
            <span class="pdf-page-info">
                Página <strong id="page-num">1</strong> de <strong id="page-count">?</strong>
            </span>
            <button type="button" class="pdf-btn" id="btn-next" title="Próxima página">
                ▶
            </button>
        </div>

        <div class="pdf-nav-group">
            <button type="button" class="pdf-btn" id="btn-zoom-out" title="Diminuir zoom">−</button>
            <span class="pdf-page-info" id="zoom-label" style="min-width:60px;">100%</span>
            <button type="button" class="pdf-btn" id="btn-zoom-in" title="Aumentar zoom">+</button>
            <button type="button" class="pdf-btn" id="btn-fit" title="Ajustar à largura">
                ⇔
            </button>
        </div>
    </nav>

    <div class="pdf-viewer" id="pdf-viewer">
        <div class="pdf-estado" id="pdf-estado">
            <div class="spinner"></div>
            <p id="pdf-status">Carregando PDF...</p>
        </div>
        <canvas id="pdf-canvas" style="display:none;"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase.js"></script>
    <script src="../js/visualizar-pdf.js"></script>

</body>

</html>
