<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Cifra</title>
    <link rel="shortcut icon" href="../img/logo_branco.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../css/estilo.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>

<body>

    <header>
        <div class="header-left">
            <img src="../img/logo.png" alt="IBR" class="logo">
        </div>
        <div class="header-right">
            <button class="menu-hamburger" id="menuToggle" aria-label="Menu">&#9776;</button>
            <nav class="menu-dropdown" id="menuDropdown">
                <a href="../index.html">🏠 Início</a>
                <a href="pesquisa.html">🔍 Pesquisar Cifras</a>
                <a href="enviar.html">📤 Enviar Nova Cifra</a>
            </nav>
        </div>
    </header>

    <main>
        <h1 id="titulo-pagina" class="titulo-principal titulo-pagina-enviar">📤 Enviar Nova Cifra</h1>

        <div class="pagina-interna">
            <form id="form-enviar" class="form-cifra">

                <label for="nome">Nome da música (obrigatório)</label>
                <input type="text" id="nome" placeholder="Ex: A Ele a Glória" required>

                <label for="interprete">Intérprete (opcional)</label>
                <input type="text" id="interprete" placeholder="Ex: Ministério de Louvor">

                <label for="tom">Tom (opcional)</label>
                <input type="text" id="tom" placeholder="Ex: C, G, Am...">

                <label for="arquivo-pdf">Arquivo PDF (obrigatório)</label>
                <input type="file" id="arquivo-pdf" accept=".pdf" required>
                <div id="status-extração" class="status-extracao"></div>

                <button type="button" id="btn-editar-conteudo" class="btn btn-outline btn-editar-conteudo">
                    ✏️ Editar conteúdo extraído
                </button>

                <div id="area-edicao" class="area-edicao">
                    <label for="conteudo-manual">Conteúdo (Esse campo é utilizado para pesquisar através da letra):</label>
                    <textarea id="conteudo-manual" rows="8" placeholder="O texto extraído do PDF aparecerá aqui..."></textarea>
                    <div class="botoes-edicao">
                        <button type="button" id="btn-salvar-edicao" class="btn btn-primary btn-salvar-edicao">
                            ✅ Salvar edição
                        </button>
                        <button type="button" id="btn-cancelar-edicao" class="btn btn-secondary btn-cancelar-edicao">
                            ❌ Cancelar
                        </button>
                    </div>
                </div>

                <input type="hidden" id="conteudo" value="">
                <input type="hidden" id="modo-edicao" value="false">
                <input type="hidden" id="cifra-id" value="">

                <div class="grupo-botoes">
                    <button type="submit" class="btn btn-primary" id="btn-enviar">Enviar</button>
                    <button type="button" id="cancelar" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <img src="../img/logo.png" alt="IBR" class="logo-footer">
    </footer>

    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="../js/firebase.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/enviar.js"></script>

</body>

</html>
